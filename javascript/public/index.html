<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carga de datos de demanda</title>
</head>
<body>
  <main>
    <h1>Carga de datos de demanda</h1>

    <form id="form-carga">
      <p>
        <label for="serie">Demanda real por período (separada por comas)</label><br>
        <input id="serie" name="serie" type="text" size="50" required>
      </p>
      <p>
        <label for="ventana">Ventana del promedio móvil</label><br>
        <input id="ventana" name="ventana" type="number" min="1" value="3" required>
      </p>
      <button type="submit">Cargar datos</button>
    </form>

    <p id="mensaje" role="status"></p>
    <ol id="pronosticos"></ol>
  </main>

  <script src="carga.js"></script>
</body>
</html>
